name: OpenCode TODO Scan

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 09:00 UTC
  workflow_dispatch: # manual run for debugging

jobs:
  opencode-todo-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      issues: write
    concurrency:
      group: opencode-todo-scan
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Get report date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/qwen3.8-flash
          use_github_token: true
          prompt: |
            Scan this codebase for TODO and FIXME comments.
            Search only source files under backend/, frontend/ and
            contracts/main.tsp; skip .github/, docs/, *.md (including
            GLOSSARY.md), node_modules and any build or generated output.
            Match case-insensitively and report only real code comments,
            not prose mentions.
            For each occurrence report the file path, line number and
            comment text, grouped by file, starting with a summary count.
            The report must be in English.
            If there are no occurrences, do not create an issue: just
            print "No TODO/FIXME found" to the job log and stop.
            Otherwise create a single GitHub issue titled
            "Weekly TODO/FIXME report (${{ steps.date.outputs.date }})"
            with the full report as the body and the "todo-report" label
            (create the label first if it does not exist).
            Do not modify any files or create any commits.
